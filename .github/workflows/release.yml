# Publishes a Foundry-installable release whenever main has a module.json version that has no
# release yet: bump "version" (and the matching "download" URL), push, and the release appears.
# Can also be run by hand from the Actions tab ("Run workflow").
name: Release

on:
  push:
    branches: [main]
    paths: [module.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version module.json)"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check module.json download points at this version
        if: steps.version.outputs.exists != 'true'
        run: |
          DOWNLOAD="$(jq -r .download module.json)"
          case "$DOWNLOAD" in
            *"/releases/download/${{ steps.version.outputs.tag }}/module.zip") ;;
            *) echo "::error::module.json download ($DOWNLOAD) does not point at ${{ steps.version.outputs.tag }}"; exit 1 ;;
          esac

      - name: Build module.zip and release notes
        if: steps.version.outputs.exists != 'true'
        run: |
          zip -r -X module.zip module.json scripts templates styles languages LICENSE README.md CHANGELOG.md
          {
            echo "**Manifest URL:** \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json\`"
            echo
            awk -v head="## ${{ steps.version.outputs.version }} " 'index($0, head) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" module.json module.zip \
            --target "$GITHUB_SHA" \
            --title "Foundry Tube ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
